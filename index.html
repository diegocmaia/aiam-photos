<style>
/* Layout: a contact sheet. Huge condensed wordmark, then a quiet masonry of frames, each tagged with its frame number and date like a film edge. */
:root {
  --bg: #0e0d0c;
  --fg: #ebe6df;
  --muted: #8a837a;
  --line: #2a2724;
  --edge: #e2a45a;           /* film-edge amber, used only for frame numbers */
  --shade: rgba(8, 7, 6, .94);
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f1ee; --fg: #161412; --muted: #77706a; --line: #dcd7d1; --edge: #b0651c;
    --shade: rgba(243, 241, 238, .96); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f1ee; --fg: #161412; --muted: #77706a; --line: #dcd7d1; --edge: #b0651c;
  --shade: rgba(243, 241, 238, .96); color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--mono); font-size: 12px; letter-spacing: .02em;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.wrap { max-width: 1400px; margin: 0 auto; }

/* a quiet masthead: wordmark and details share one line, the photos do the talking */
header {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 24px;
  padding-block: clamp(24px, 4vw, 44px) clamp(14px, 2vw, 22px);
  border-bottom: 1px solid var(--line);
}
h1 {
  margin: 0;
  font-family: var(--display); font-stretch: 75%; font-weight: 700;
  font-size: clamp(30px, 5vw, 52px); line-height: 1; letter-spacing: -.02em;
  text-transform: uppercase;
}
h1 .dot { color: var(--edge); }
.meta { color: var(--muted); text-transform: uppercase; letter-spacing: .12em; display: flex; flex-wrap: wrap; gap: 6px 20px; }
.meta b { color: var(--fg); font-weight: 500; }
.meta { align-items: center; }
.sort { display: inline-flex; border: 1px solid var(--line); }
.sort button {
  all: unset; cursor: pointer; padding: 3px 9px; color: var(--muted);
  font: inherit; letter-spacing: inherit; text-transform: inherit;
}
.sort button:hover { color: var(--fg); }
.sort button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.sort button:focus-visible { outline: 2px solid var(--edge); outline-offset: 2px; }
/* colour chip beside the frame number, shown when the sheet is sorted by colour */
.chip { display: none; width: 8px; height: 8px; margin-right: 6px; vertical-align: 0; }
.by-colour .chip { display: inline-block; }
::view-transition-group(*) { animation-duration: .7s; animation-timing-function: cubic-bezier(.3,.7,.2,1); }

.sheet {
  /* masonry built in script: posts are dealt into columns in date order, so rows read newest-first left to right */
  display: flex; align-items: flex-start; gap: clamp(12px, 2vw, 24px);
  padding-top: clamp(20px, 3vw, 36px);
}
.col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }
.frame {
  margin: 0 0 clamp(16px, 2.4vw, 32px);
  display: flex; flex-direction: column; gap: 8px;
}
.frame button {
  all: unset; cursor: zoom-in; display: block; overflow: hidden; background: var(--line);
  outline-offset: 3px;
}
.frame button:focus-visible { outline: 2px solid var(--edge); }
.frame img {
  display: block; width: 100%; height: auto; max-width: 100%;
  transition: transform .9s cubic-bezier(.2,.7,.1,1), filter 1.6s cubic-bezier(.25,.6,.2,1), opacity 1.1s ease;
  filter: saturate(.92);
}
/* a print in the developer tray: pale and flat until it scrolls into view, then deepens to full colour */
.frame img.latent { opacity: .35; filter: brightness(1.55) contrast(.5) saturate(0); }
.frame button:hover img { transform: scale(1.025); filter: saturate(1); }
figcaption { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-variant-numeric: tabular-nums; text-transform: uppercase; letter-spacing: .1em; font-size: 11px; }
figcaption .n { color: var(--edge); }

footer {
  margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line);
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px;
  color: var(--muted); text-transform: uppercase; letter-spacing: .12em; font-size: 11px;
}
a { color: inherit; text-underline-offset: 3px; }
a:hover { color: var(--fg); }

/* stack badge on posts with more than one frame */
.frame button { position: relative; }
.badge {
  position: absolute; top: 10px; right: 10px; z-index: 1;
  padding: 4px 7px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: #f4efe8; background: rgba(12, 11, 10, .62); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  font-variant-numeric: tabular-nums; pointer-events: none;
}

/* viewer */
.lb {
  /* the viewer is always dark, whatever the page theme: photos read best on near-black */
  --bg: #0e0d0c; --fg: #ebe6df; --muted: #8a837a; --line: #2a2724; --edge: #e2a45a;
  color-scheme: dark; color: var(--fg);
  position: fixed; inset: 0; z-index: 20; background: var(--bg);
  transition: --glow .9s ease;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  animation: fade .25s ease;
}
/* the photo's own colour glows faintly behind it, like a print on a lightbox */
@property --glow { syntax: "<color>"; inherits: true; initial-value: #0e0d0c; }
.lb::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 75% 65% at 50% 50%, color-mix(in srgb, var(--glow) 42%, transparent), transparent 72%);
}
.lb > * { position: relative; z-index: 1; }
.lb-top, .lb-bot { display: flex; justify-content: space-between; align-items: center; gap: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-variant-numeric: tabular-nums; }
.lb-top .n { color: var(--edge); }
.track {
  min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x mandatory; scroll-behavior: smooth; overscroll-behavior-x: contain;
  scrollbar-width: none; margin-block: 16px;
}
.track::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; min-width: 0; height: 100%; scroll-snap-align: center; display: flex; align-items: center; justify-content: center; overflow: hidden; }
/* photos fill the slide and letterbox inside it; videos keep their own box so the controls sit on the picture */
.slide img { display: block; width: 100%; height: 100%; object-fit: contain; }
.slide video { display: block; width: 100%; height: auto; max-height: 100%; object-fit: contain; }
.mid { display: flex; align-items: center; gap: 14px; }
.dots { display: flex; gap: 6px; }
.dots button { all: unset; width: 6px; height: 6px; border-radius: 50%; background: var(--line); cursor: pointer; }
.dots button[aria-current="true"] { background: var(--edge); }
.dots button:focus-visible { outline: 2px solid var(--edge); outline-offset: 2px; }
.lb .ctl {
  font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--fg);
  background: none; border: 1px solid var(--line); padding: 8px 14px; cursor: pointer;
}
.lb .ctl:hover { border-color: var(--fg); }
.lb .ctl:focus-visible { outline: 2px solid var(--edge); outline-offset: 2px; }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@media (max-width: 600px) {
  .sheet { gap: 8px; }
  .frame { margin-bottom: 16px; gap: 6px; }
  figcaption { font-size: 9.5px; letter-spacing: .06em; }
  .badge { top: 6px; right: 6px; padding: 3px 5px; font-size: 9px; }
}
@media (max-width: 520px) { .lb .ctl { padding: 8px 10px; } .pos { display: none; } }
@media (prefers-reduced-motion: reduce) {
  .frame img, .lb { transition: none; animation: none; }
  ::view-transition-group(*) { animation: none; }
  .track { scroll-behavior: auto; }
}
</style>

const total = POSTS.length;
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const month = d => new Date(d + "T12:00:00").toLocaleDateString("en-GB", { month: "short", year: "numeric" });
document.getElementById("span").textContent = `${month(POSTS[total - 1].date)} — ${month(POSTS[0].date)}`;

const frameNo = i => String(total - i).padStart(2, "0") + "A";
document.getElementById("nPosts").textContent = total;

const sheet = document.getElementById("sheet");
// Colour order: hues from pink round through red, orange, yellow, green, blue and violet,
// then the near-colourless photos from light to dark (the moon comes last).
function hueKey(hex) {
  const [r, g, b] = [1, 3, 5].map(k => parseInt(hex.slice(k, k + 2), 16) / 255);
  const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, d = max - min;
  const sat = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
  if (sat < 0.14 || l < 0.1) return 1000 + (1 - l);
  let h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  h = (h * 60 + 360) % 360;
  return (h - 320 + 360) % 360;
}

  fig.className = "frame";
  fig.innerHTML = `<button type="button" aria-label="Open post from ${fmt(p.date)}${n > 1 ? ", " + n + " frames" : ""}">${badge}<img src="photos/grid/${name}-1000.webp" srcset="photos/grid/${name}-600.webp 600w, photos/grid/${name}-1000.webp 1000w" sizes="(max-width: 1040px) 50vw, 460px" width="${w}" height="${h}" alt="${esc(alt || "Photograph")}, ${fmt(p.date)}" loading="${i < 6 ? "eager" : "lazy"}" decoding="async"></button>
    <figcaption><span class="n"><span class="chip" style="background:${colour}"></span>${frameNo(i)}</span><span>${fmt(p.date)}</span></figcaption>`;
  fig.querySelector("button").addEventListener("click", () => open(i));
  fig.ratio = h / w;
  fig.hueKey = hueKey(colour);
  fig.style.viewTransitionName = "f" + i;
  return fig;
});

// Deal frames into columns in date order, each going to the shortest column (leftmost on a tie),
// so the newest posts sit side by side across the top. Rebuilt only when the column count changes.
let nCols = 0, order = frames;
function layout(force) {
  const n = sheet.clientWidth >= 1000 ? 3 : 2;
  if (n === nCols && !force) return;
  nCols = n;
  const cols = Array.from({ length: n }, () => Object.assign(document.createElement("div"), { className: "col" }));
  const heights = new Array(n).fill(0);
  order.forEach(f => {
    const c = heights.indexOf(Math.min(...heights));
    cols[c].appendChild(f);
    heights[c] += f.ratio + 0.12;   // + caption and gap, in column-width units
  });
  sheet.replaceChildren(...cols);
}
window.addEventListener("resize", () => layout());

// Date / Colour switch. The frames glide to their new places where the browser supports view transitions.
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function sortBy(mode, animate) {
  order = mode === "colour" ? [...frames].sort((a, b) => a.hueKey - b.hueKey) : frames;
  document.querySelectorAll(".sort button").forEach(b => b.setAttribute("aria-pressed", b.dataset.sort === mode));
  const apply = () => { sheet.classList.toggle("by-colour", mode === "colour"); layout(true); };
  if (animate && document.startViewTransition && !reduceMotion) document.startViewTransition(apply); else apply();
  try { localStorage.setItem("sort", mode); } catch (e) {}
}
document.querySelectorAll(".sort button").forEach(b => b.addEventListener("click", () => sortBy(b.dataset.sort, true)));
let saved = "date";
try { saved = localStorage.getItem("sort") || "date"; } catch (e) {}
sortBy(saved === "colour" ? "colour" : "date", false);

// Develop each grid photo once it has loaded and scrolled into view.
if ("IntersectionObserver" in window && !reduceMotion) {
  const io = new IntersectionObserver(entries => entries.forEach(e => {
    if (!e.isIntersecting) return;
    const img = e.target; io.unobserve(img);
    const develop = () => requestAnimationFrame(() => img.classList.remove("latent"));
    if (img.complete) develop(); else { img.addEventListener("load", develop, { once: true }); img.addEventListener("error", develop, { once: true }); }
  }), { threshold: 0.15 });
  frames.forEach(f => { const img = f.querySelector("img"); img.classList.add("latent"); io.observe(img); });
}

const lb = document.getElementById("lb"), track = document.getElementById("track"), dots = document.getElementById("dots");
let post = 0, slide = 0, lastFocus = null;

function slideEl([name, w, h, isVid, alt]) {
  const s = document.createElement("div");
  s.className = "slide";
  if (isVid) {
    s.innerHTML = `<video src="photos/video/${name}.mp4" poster="photos/grid/${name}-1000.webp" width="${w}" height="${h}" aria-label="${esc(alt || "Video")}" muted loop playsinline controls preload="metadata"></video>`;
  } else {
    const img = new Image();
    img.src = `photos/grid/${name}-1000.webp`; img.width = w; img.height = h; img.alt = alt || "Photograph";
    const big = new Image(); big.onload = () => { img.src = big.src; }; big.src = `photos/large/${name}.webp`;
    s.appendChild(img);
  }
  return s;
}

function showPost(i, startAt = 0) {
  post = (i + total) % total;
  const p = POSTS[post];
  if (location.hash !== "#" + p.id) history.replaceState(null, "", "#" + p.id);
  track.replaceChildren(...p.items.map(slideEl));
  dots.replaceChildren(...p.items.map((_, k) => {
    const b = document.createElement("button");
    b.type = "button"; b.setAttribute("aria-label", `Frame ${k + 1} of ${p.items.length}`);
    b.onclick = () => goSlide(k);
    return b;
  }));
  dots.hidden = p.items.length < 2;
  document.getElementById("lbN").textContent = frameNo(post);
  document.getElementById("lbD").textContent = fmt(p.date);
  slide = -1;
  const k = startAt < 0 ? p.items.length - 1 : startAt;
  track.style.scrollBehavior = "auto"; track.scrollLeft = k * track.clientWidth; track.style.scrollBehavior = "";
  setSlide(k);
}
function setSlide(k) {
  if (k === slide) return;
  slide = k;
  lb.style.setProperty("--glow", POSTS[post].items[k][5] || "#0e0d0c");
  const n = POSTS[post].items.length;
  [...dots.children].forEach((d, j) => d.setAttribute("aria-current", j === k));
  document.getElementById("lbPos").textContent = n > 1 ? `${k + 1} / ${n}` : `Post ${post + 1} of ${total}`;
  track.querySelectorAll("video").forEach((v, j) => {
    if (v.closest(".slide") === track.children[k]) v.play().catch(() => {}); else v.pause();
  });
  // on a post's last frame, start fetching the next post's first photo so moving on feels instant
  if (k === n - 1) {
    const [name, , , isVid] = POSTS[(post + 1) % total].items[0];
    if (!isVid) new Image().src = `photos/large/${name}.webp`;
  }
}
function goSlide(k) { track.scrollTo({ left: k * track.clientWidth }); setSlide(k); }
function step(dir) {
  const n = POSTS[post].items.length, k = slide + dir;
  if (k >= 0 && k < n) goSlide(k);
  else showPost(post + dir, dir < 0 ? -1 : 0);
}
let scrollT;
track.addEventListener("scroll", () => {
  clearTimeout(scrollT);
  scrollT = setTimeout(() => setSlide(Math.round(track.scrollLeft / track.clientWidth)), 80);
}, { passive: true });

// swiping past the first or last frame of a post moves to the neighbouring post
let x0 = null, startSlide = 0;
track.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; startSlide = slide; }, { passive: true });
track.addEventListener("touchend", e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0; x0 = null;
  const n = POSTS[post].items.length;
  if (dx < -60 && startSlide === n - 1) showPost(post + 1, 0);
  else if (dx > 60 && startSlide === 0) showPost(post - 1, -1);
});

// Each post has its own link (#<post id>), so a single photo can be shared.
// Opening from the grid adds a history entry, so the phone's back gesture closes the viewer.
let pushed = false;
function open(i) {
  if (!pushed) { history.pushState(null, "", "#" + POSTS[i].id); pushed = true; }
  show(i);
}
function show(i) {
  if (lb.hidden) {
    lastFocus = document.activeElement;
    lb.hidden = false; document.body.style.overflow = "hidden";
  }
  showPost(i, 0);
  document.getElementById("lbClose").focus();
}
function hide() {
  track.querySelectorAll("video").forEach(v => v.pause());
  lb.hidden = true; document.body.style.overflow = "";
  track.replaceChildren();
  lastFocus && lastFocus.focus();
}
function close() {
  if (pushed) { pushed = false; history.back(); return; }   // popstate hides the viewer
  history.replaceState(null, "", location.pathname + location.search);
  hide();
}
function route() {
  const i = POSTS.findIndex(p => "#" + p.id === location.hash);
  if (i >= 0) { if (lb.hidden || i !== post) show(i); }
  else if (!lb.hidden) { pushed = false; hide(); }
}
window.addEventListener("popstate", route);
route();   // a shared link opens straight into its post
document.getElementById("lbClose").onclick = close;
document.getElementById("lbPrev").onclick = () => step(-1);
document.getElementById("lbNext").onclick = () => step(1);
track.addEventListener("click", e => { if (e.target.classList.contains("slide")) close(); });
document.addEventListener("keydown", e => {
  if (lb.hidden) return;
  if (e.key === "Escape") close();
  else if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
});
window.addEventListener("resize", () => { if (!lb.hidden) { track.style.scrollBehavior = "auto"; track.scrollLeft = slide * track.clientWidth; track.style.scrollBehavior = ""; } });
</script>
